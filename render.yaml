services:
  - type: web
    name: airbnb-api
    env: node
    buildCommand: cd api && npm install
    startCommand: cd api && npm start
    runtime: node
    region: ohio
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false

  - type: static
    name: airbnb-client
    buildCommand: cd client && npm install && npm run build
    publishDir: client/dist
